name: Create Accuracy Improver Release Keystore (RUN ONCE ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-release-keystore:
    name: Create keystore once - keep it safe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Java 17 on GitHub runner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore securely
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$KS_EXISTING" ]]; then
            echo "ERROR: Secret KEYSTORE_BASE64 sudah ada. Workflow ini tidak boleh dijalankan lagi, karena kunci baru tidak bisa menimpa aplikasi yang sudah terpasang." >&2
            exit 1
          fi
          if [[ ${#KS_PASS} -lt 16 ]]; then
            echo "ERROR: Isi secret KEYSTORE_PASSWORD minimal 16 karakter." >&2
            exit 1
          fi
          if [[ -z "$KS_ALIAS" || ! "$KS_ALIAS" =~ ^[A-Za-z0-9_-]{3,40}$ ]]; then
            echo "ERROR: Isi secret KEY_ALIAS (contoh: accuracy-improver)." >&2
            exit 1
          fi
          mkdir -m 700 -p "$RUNNER_TEMP/ai-signing"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/ai-signing/accuracy-improver-release.jks" \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Accuracy Improver,OU=Release Signing,O=Accuracy Improver,C=ID" \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS"
          test -s "$RUNNER_TEMP/ai-signing/accuracy-improver-release.jks"
          echo "Keystore dibuat. Sidik jari sertifikat publik:"
          keytool -list -v \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/ai-signing/accuracy-improver-release.jks" \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" | grep -E "SHA256:|SHA-256:" || true
          echo "PENTING: unduh sekali, simpan cadangan aman, lalu isi secret KEYSTORE_BASE64. Jangan jalankan ulang untuk mengganti kunci."

      - name: Upload keystore (kedaluwarsa 1 hari)
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-improver-keystore-ONE-TIME-CONFIDENTIAL
          path: ${{ runner.temp }}/ai-signing/accuracy-improver-release.jks
          if-no-files-found: error
          retention-days: 1
